# =============================================================================
# ProcTHOR Environment Configuration File
# =============================================================================

# -----------------------------------------------------------------------------
# Basic Environment Configuration
# -----------------------------------------------------------------------------
env:
  type: procthor # Environment type
  width: 800 # Rendered image width (pixels)
  height: 600 # Rendered image height (pixels)
  field_of_view: 60 # Camera field of view (degrees), default 60 (non-wide angle)
  grid_size: 0.25 # Navigation grid size (meters), affects movement precision
  render_depth: false # Whether to render depth map
  render_instance_segmentation: false # Whether to render instance segmentation map
  text_state_mode: first_person # Text state description mode: first_person / omniscient
  visibility_distance: 1.0 # Object visibility distance threshold (meters), also means interaction distance affects obj["visible"] in metadata
  dataset_name: procthor-10k # ProcTHOR dataset name
  scene_index: 0 # Scene index in the dataset (0-9999 for procthor-10k)
  agent_count: 2
  # Rendering platform configuration:
  # - null: Auto-selection (requires X11 display server)
  # - CloudRendering: Headless mode (no X11 required, recommended for servers)
  # Can also be set via --headless command line argument
  platform: null
  # Unity 2020 does not auto-select Mesa's CPU Vulkan device (requestedDeviceIndex=-1),
  # which makes the CloudRendering process segfault before opening its FIFO. Select
  # llvmpipe device 0 directly; AI2-THOR's gpu_device option is NVIDIA-only.
  force_vulkan_device_index: 0
  server_start_timeout: 300
  dataset_dir: /mnt/dolphinfs/ssd_pool/docker/user/hadoop-videogen-hl/hadoop-camera3d/zhangshengjun/worldmodel/SpatialWorld/data/procthor-10k
  dataset_split: train
  # ---------------------------------------------------------------------------
  # AI2-THOR/ProcTHOR network + runtime dependency configuration
  # ---------------------------------------------------------------------------
  # Root cause of "ValueError: Invalid commit_id: ... no build exists for arch=Linux
  # platforms=CloudRendering": Controller() checks build availability against
  # s3-us-west-2.amazonaws.com; on machines without outbound internet access this always
  # fails. VERIFIED FIX: configuring an HTTP(S) proxy that can reach AWS S3 resolves this
  # (the build DOES exist for the default commit_id once the network path works).
  http_proxy: http://10.70.18.228:8412
  https_proxy: http://10.70.18.228:8412
  # After the proxy issue is fixed, Controller() may then fail with:
  #   "Platform CloudRendering failed validation ... Vulkan API driver missing.
  #    CloudRendering requires libvulkan1."
  # This is unrelated to the network -- it means this machine lacks the Vulkan Loader
  # (libvulkan.so.1), and most compute nodes have no root access to apt-get install it.
  # Fix without root: point at a directory that already contains libvulkan.so.1 (e.g. the
  # lib/ dir of a conda env where ai2thor already works, or one created via
  # `conda install -c conda-forge vulkan-loader`). This directory is merged into
  # LD_LIBRARY_PATH before Controller() is constructed.
  ai2thor_ld_library_path: /mnt/dolphinfs/ssd_pool/docker/user/hadoop-videogen-hl/hadoop-camera3d/zhangshengjun/conda-envs/spatialworld-ai2thor/lib
  # This machine lacks a working vendor GPU Vulkan ICD (real NVIDIA Vulkan driver causes the
  # ai2thor Unity process to hang during init; root cause not yet fixed), so fall back to
  # Mesa's lavapipe software Vulkan renderer (much slower, but works everywhere; see the
  # mesa-vulkan conda env under the same conda-envs/ directory):
  ai2thor_vk_icd_filenames: /mnt/dolphinfs/ssd_pool/docker/user/hadoop-videogen-hl/hadoop-camera3d/zhangshengjun/conda-envs/mesa-vulkan/share/vulkan/icd.d/lvp_icd.x86_64.json
  # NOTE: ai2thor_home is intentionally NOT set here. wrapper.py reads
  # env.ai2thor_home with priority over the AI2THOR_HOME environment variable
  # (env_config.get("ai2thor_home", os.environ.get("AI2THOR_HOME"))), so hardcoding
  # a shared DolphinFS path here would silently override the *local* per-node/
  # container cache path (AI2THOR_HOME) that hope/launch_*_benchmark.sh exports via
  # seed_local_ai2thor_cache(). That reintroduces the cross-node fcntl.lockf()
  # deadlock in ai2thor/util/lock.py (Controller() calling self._build.lock_sh())
  # -- the exact "stuck forever right after AI2ThorEnvWrapper.__init__ starting,
  # heartbeat forever, no further log lines" symptom. Let it fall back to the
  # AI2THOR_HOME env var (local disk) instead; if you need to override it for a
  # one-off local run, pass it via the AI2THOR_HOME/AI2THOR_LOCAL_HOME env vars,
  # not here.
  # Optional alternative to the above: download the matching Unity build once on a machine
  # that CAN reach AWS S3 (running the same ai2thor version auto-downloads it to
  # ~/.ai2thor/releases/), copy that build directory to this machine, then point to it here
  # (or set env var AI2THOR_LOCAL_EXECUTABLE_PATH instead):
  # local_executable_path: /path/to/copied/thor-Linux64-<commit_id>/thor-Linux64-<commit_id>
  # Alternatively, pin a specific commit_id known to be reachable from this network
  # (or set env var AI2THOR_COMMIT_ID):
  # commit_id: null

# -----------------------------------------------------------------------------
# Dual Agent Specific Configuration
# -----------------------------------------------------------------------------
dual_agent:
  relocate_agent2_near_agent1: true
  second_agent_spawn_offset_m: 0.75


# -----------------------------------------------------------------------------
# Agent Runtime Configuration
# -----------------------------------------------------------------------------
max_steps: 30 # Maximum steps per episode

# Context management (for controlling the length of historical trajectories sent to LLM)
context_management:
  enable_long_term_summary: false # Whether to enable long-term semantic summary (<SUMMARY> tag)
  short_term_history_window_size: 30 # Short-term history window size (recent N-step multimodal history)

# -----------------------------------------------------------------------------
# Model Configuration
# -----------------------------------------------------------------------------
model:
  vlm:
    provider: openai
    model_name: Doubao-Seed-2.0-lite
    temperature: 1.0
    top_p: 0.9
    max_tokens: 4096
    base_url: https://aigc.sankuai.com/v1/openai/native
    api_key: "2011286628471992379"

# -----------------------------------------------------------------------------
# Logging and Output Configuration
# -----------------------------------------------------------------------------
logging:
  stdout_verbose: true # Whether to output detailed logs to console
  save_step_images: true # Whether to save images for each step

# -----------------------------------------------------------------------------
# Action Parameter Configuration
# -----------------------------------------------------------------------------
# Step granularity (Large / Medium / Small) — aligned with AI2-THOR
# Large=1m, Medium=0.5m, Small=0.25m. Default when omitted: Small.
actions:
  move_small_magnitude: 0.25   # Small (default when not specified)
  move_medium_magnitude: 0.5   # Medium
  move_large_magnitude: 1      # Large
  # Backward compatibility: single magnitude (treated as default Small)
  move_ahead_magnitude: 0.25
  move_back_magnitude: 0.25
  move_left_magnitude: 0.25
  move_right_magnitude: 0.25
  rotate_degrees: 90 # Rotation angle (degrees)

# -----------------------------------------------------------------------------
# Reward Function Configuration (for reinforcement learning or evaluation)
# -----------------------------------------------------------------------------
reward:
  success_reward: 10.0 # Task success reward
  step_success_bonus: 0.1 # Small reward for each successful action
  step_failure_penalty: -0.05 # Penalty for each failed action

# -----------------------------------------------------------------------------
# Experiment Configuration
# -----------------------------------------------------------------------------
experiment:
  num_episodes: 1 # Number of episodes to run
  output_dir: outputs # Output directory

# =============================================================================
# Task Presets
# Each task includes: scene_index, task description, target objects, success conditions, etc.
# =============================================================================
task_presets:
  # ---------------------------------------------------------------------------
  # Task: Open Fridge
  # ---------------------------------------------------------------------------
  open_fridge:
    scene_index: 0 # ProcTHOR scene index
    description: You are now in a kitchen scene, please look around like a person to find the fridge, then walk to the front of the fridge, and finally try to open the fridge door.
    target_object_types:
      - Fridge # Target object type
    success_condition: # Success condition
      type: object_state # Condition type: check object state
      field: isOpen # Field to check
      value: true # Expected value
      any: true # Any one matching is sufficient
    target_description: Find and open any Fridge

  # ---------------------------------------------------------------------------
  # Task: Open Microwave
  # ---------------------------------------------------------------------------
  open_microwave:
    scene_index: 0
    description: Find the microwave in the kitchen, walk to the front of it, and then open the microwave door.
    target_object_types:
      - Microwave
    success_condition:
      type: object_state
      field: isOpen
      value: true
      any: true
    target_description: Find and open any Microwave

  # ---------------------------------------------------------------------------
  # Task: Pick Up Egg
  # ---------------------------------------------------------------------------
  pickup_egg:
    scene_index: 0
    description: Find the egg (Egg), approach it, and then pick up the egg.
    target_object_types:
      - Egg
    success_condition:
      type: object_in_hand # Condition type: check object in hand
      object_type: Egg
    target_description: Find and pick up the egg (Egg)
    max_steps: 25 # Override global max_steps
