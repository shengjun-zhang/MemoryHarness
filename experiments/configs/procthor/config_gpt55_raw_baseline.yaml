env:
  type: procthor
  width: 800
  height: 600
  field_of_view: 60
  grid_size: 0.25
  render_depth: false
  render_instance_segmentation: false
  text_state_mode: first_person
  visibility_distance: 1.0
  dataset_name: procthor-10k
  scene_index: 0
  agent_count: 1
  platform: null
max_steps: 30
model:
  vlm:
    provider: openai
    model_name: gpt-5.5
    temperature: 1.0
    top_p: null
    max_tokens: 4096
    base_url: https://aigc.sankuai.com/v1/openai/native
    api_key: null
logging:
  stdout_verbose: true
  save_step_images: true
actions:
  move_small_magnitude: 0.25
  move_medium_magnitude: 0.5
  move_large_magnitude: 1
  move_ahead_magnitude: 0.25
  move_back_magnitude: 0.25
  move_left_magnitude: 0.25
  move_right_magnitude: 0.25
  rotate_degrees: 90
reward:
  success_reward: 10.0
  step_success_bonus: 0.1
  step_failure_penalty: -0.05
experiment:
  num_episodes: 1
  output_dir: outputs
task_presets:
  open_fridge:
    scene_index: 0
    description: You are now in a kitchen scene, please look around like a person
      to find the fridge, then walk to the front of the fridge, and finally try to
      open the fridge door.
    target_object_types:
    - Fridge
    success_condition:
      type: object_state
      field: isOpen
      value: true
      any: true
    target_description: Find and open any Fridge
  open_microwave:
    scene_index: 0
    description: Find the microwave in the kitchen, walk to the front of it, and then
      open the microwave door.
    target_object_types:
    - Microwave
    success_condition:
      type: object_state
      field: isOpen
      value: true
      any: true
    target_description: Find and open any Microwave
  pickup_egg:
    scene_index: 0
    description: Find the egg (Egg), approach it, and then pick up the egg.
    target_object_types:
    - Egg
    success_condition:
      type: object_in_hand
      object_type: Egg
    target_description: Find and pick up the egg (Egg)
    max_steps: 25
